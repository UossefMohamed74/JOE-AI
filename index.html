<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipnex AI — Official Technical Engine</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --border-color: #232a3b;
            --accent-color: #00f2fe;
            --green: #00e676;
            --red: #ff5252;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; padding: 10px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 15px; }
        .logo { font-size: 20px; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .dashboard-grid { grid-template-columns: 2fr 1fr; } }

        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        input, select, button { width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); font-size: 13px; outline: none; }
        button.btn-primary { background: linear-gradient(45deg, #00c6ff, #0072ff); border: none; font-weight: bold; cursor: pointer; color: #fff; margin-top: 8px; }

        .chart-container { height: 400px; width: 100%; border-radius: 8px; overflow: hidden; }
        .ta-container { height: 400px; width: 100%; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><i class="fa-solid fa-brain"></i> Pipnex AI <span style="font-size: 10px; background: var(--accent-color); color: #000; padding: 2px 6px; border-radius: 4px;">TRADINGVIEW LIVE</span></div>
        <div style="font-size: 11px; color: var(--green);">● دقة تحليلات رسمية 100%</div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">
                <span><i class="fa-solid fa-chart-candlestick"></i> الرسم البياني المباشر</span>
                <select id="pairSelect" style="width: auto; padding: 4px 8px;" onchange="changeSymbol()">
                    <option value="OANDA:XAUUSD">XAU/USD (الذهب)</option>
                    <option value="FX:EURUSD">EUR/USD</option>
                    <option value="FX:GBPUSD">GBP/USD</option>
                    <option value="BINANCE:BTCUSDT">BTC/USDT</option>
                </select>
            </div>
            <div class="chart-container" id="tradingview_chart"></div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fa-solid fa-microchip"></i> مؤشرات ملخص التحليل الفني اللحظي</div>
            <div class="ta-container" id="tradingview_ta"></div>
        </div>
    </div>

    <div class="card" style="margin-top: 15px;">
        <div class="card-title"><i class="fa-solid fa-calculator"></i> حاسبة إدارة المخاطر اللحظية</div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px;">
            <div class="form-group"><label>رأس المال ($)</label><input type="number" id="calcBalance" value="1000"></div>
            <div class="form-group"><label>المخاطرة (%)</label><input type="number" id="calcRisk" value="1"></div>
            <div class="form-group"><label>الاستوب (Pips)</label><input type="number" id="calcSL" value="30"></div>
            <div class="form-group" style="display:flex; align-items:flex-end;"><button class="btn-primary" onclick="calculateLot()">احسب اللوت</button></div>
        </div>
        <div id="calcResult" style="margin-top: 8px; font-size: 12px; font-weight: bold; color: var(--accent-color);"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async></script>
    
    <script>
        function renderChart(symbol) {
            document.getElementById("tradingview_chart").innerHTML = "";
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "60",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ar",
                "container_id": "tradingview_chart"
            });
        }

        function renderTA(symbol) {
            const container = document.getElementById("tradingview_ta");
            container.innerHTML = "";
            const script = document.createElement("script");
            script.type = "text/javascript";
            script.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            script.async = true;
            script.innerHTML = JSON.stringify({
                "interval": "1h",
                "width": "100%",
                "isTransparent": false,
                "height": "100%",
                "symbol": symbol,
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "ar",
                "colorTheme": "dark"
            });
            container.appendChild(script);
        }

        function changeSymbol() {
            const sym = document.getElementById("pairSelect").value;
            renderChart(sym);
            renderTA(sym);
        }

        // تشغيل ابتدائي
        renderChart("OANDA:XAUUSD");
        renderTA("OANDA:XAUUSD");

        function calculateLot() {
            const balance = parseFloat(document.getElementById("calcBalance").value);
            const riskPercent = parseFloat(document.getElementById("calcRisk").value);
            const stopLossPips = parseFloat(document.getElementById("calcSL").value);
            if (!balance || !riskPercent || !stopLossPips) return;
            const riskAmount = balance * (riskPercent / 100);
            const lotSize = (riskAmount / (stopLossPips * 10)).toFixed(2);
            document.getElementById("calcResult").innerText = `العقد المناسب: ${lotSize} Lot | الخسارة المحتملة: $${riskAmount.toFixed(2)}`;
        }
    </script>
</body>
</html>
