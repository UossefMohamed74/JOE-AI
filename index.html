<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipnex AI — AI Trading & Market Analysis Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #0f131c;
            --border: #1a2233;
            --primary: #00f2fe;
            --primary-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --green: #00e676;
            --red: #ff5252;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 12px; display: flex; flex-direction: column; gap: 14px; }

        /* Pipnex Navbar Header */
        .header { background: rgba(15, 19, 28, 0.8); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .logo i { color: var(--primary); font-size: 22px; }
        .badge-ai { background: var(--primary-gradient); color: #000; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        
        .nav-links { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--text-sub); }
        .status-dot { width: 8px; height: 8px; background-color: var(--green); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--green); }

        /* Dashboard Main Layout */
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        @media (min-width: 992px) { .dashboard-grid { grid-template-columns: 2.2fr 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; color: var(--text-main); }
        .card-header span { display: flex; align-items: center; gap: 8px; }
        .card-header i { color: var(--primary); }

        /* Form Controls */
        select, input, button { width: 100%; background: #07090e; border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); padding: 10px 12px; font-size: 13px; outline: none; transition: border-color 0.2s; }
        select:focus, input:focus { border-color: var(--primary); }
        
        .btn-primary { background: var(--primary-gradient); color: #000; font-weight: 700; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }

        /* TradingView Frames */
        .chart-box { height: 450px; width: 100%; border-radius: 8px; overflow: hidden; }
        .ta-box { height: 450px; width: 100%; border-radius: 8px; overflow: hidden; }

        /* Pipnex Pulse Signal Output Box */
        .pulse-box { background: rgba(255, 255, 255, 0.02); border: 1px dashed var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .pulse-badge { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 12px; display: inline-block; }
        .pulse-buy { background: rgba(0, 230, 118, 0.15); color: var(--green); border: 1px solid var(--green); }
        .pulse-sell { background: rgba(255, 82, 82, 0.15); color: var(--red); border: 1px solid var(--red); }

        /* Calculator Grid */
        .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .calc-label { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; display: block; }
        
        .output-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .output-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <!-- Pipnex Header Nav -->
    <div class="header">
        <div class="logo">
            <i class="fa-solid fa-bolt"></i> PIPNEX AI
            <span class="badge-ai">MARKET BRAIN</span>
        </div>
        <div class="nav-links">
            <span><span class="status-dot"></span> Live SMC Engine</span>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div class="dashboard-grid">
        
        <!-- Main Trading Chart (Pipnex View) -->
        <div class="card">
            <div class="card-header">
                <span><i class="fa-solid fa-chart-area"></i> Chart Analysis & Order Blocks</span>
                <select id="pairSelect" style="width: auto; padding: 4px 10px;" onchange="changePair()">
                    <option value="OANDA:XAUUSD">XAU/USD (Gold)</option>
                    <option value="FX:EURUSD">EUR/USD</option>
                    <option value="FX:GBPUSD">GBP/USD</option>
                    <option value="BINANCE:BTCUSDT">BTC/USDT</option>
                </select>
            </div>
            <div class="chart-box" id="tv_chart"></div>
        </div>

        <!-- Pipnex Market Intelligence & AI Technical Gauge -->
        <div class="card">
            <div class="card-header">
                <span><i class="fa-solid fa-brain"></i> Technical Gauge & AI Signals</span>
            </div>
            <div class="ta-box" id="tv_ta"></div>
        </div>

    </div>

    <!-- Pipnex Position Size & Risk Calculator -->
    <div class="card">
        <div class="card-header">
            <span><i class="fa-solid fa-calculator"></i> Pipnex Risk & Lot Calculator</span>
        </div>
        <div class="calc-grid">
            <div>
                <label class="calc-label">Account Balance ($)</label>
                <input type="number" id="calcBalance" value="1000">
            </div>
            <div>
                <label class="calc-label">Risk (% Account)</label>
                <input type="number" id="calcRisk" value="1">
            </div>
            <div>
                <label class="calc-label">Stop Loss (Pips)</label>
                <input type="number" id="calcSL" value="30">
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button class="btn-primary" onclick="calculateLot()">
                    <i class="fa-solid fa-arrows-to-dot"></i> Calculate Lot
                </button>
            </div>
        </div>
        <div id="calcResult" style="display: none; margin-top: 10px; padding: 10px; background: rgba(0,242,254,0.05); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--primary); font-weight: bold;"></div>
    </div>

    <!-- Scripts -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        function loadChart(symbol) {
            document.getElementById("tv_chart").innerHTML = "";
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "60",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "container_id": "tv_chart"
            });
        }

        function loadTA(symbol) {
            const container = document.getElementById("tv_ta");
            container.innerHTML = "";
            const script = document.createElement("script");
            script.type = "text/javascript";
            script.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            script.async = true;
            script.innerHTML = JSON.stringify({
                "interval": "1h",
                "width": "100%",
                "isTransparent": true,
                "height": "100%",
                "symbol": symbol,
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark"
            });
            container.appendChild(script);
        }

        function changePair() {
            const sym = document.getElementById("pairSelect").value;
            loadChart(sym);
            loadTA(sym);
        }

        // Initialize Pipnex Layout
        loadChart("OANDA:XAUUSD");
        loadTA("OANDA:XAUUSD");

        function calculateLot() {
            const balance = parseFloat(document.getElementById("calcBalance").value);
            const riskPercent = parseFloat(document.getElementById("calcRisk").value);
            const stopLossPips = parseFloat(document.getElementById("calcSL").value);
            if (!balance || !riskPercent || !stopLossPips) return;
            const riskAmount = balance * (riskPercent / 100);
            const lotSize = (riskAmount / (stopLossPips * 10)).toFixed(2);
            
            const resultElem = document.getElementById("calcResult");
            resultElem.innerText = `Recommended Position Size: ${lotSize} Lots | Total Risk: $${riskAmount.toFixed(2)}`;
            resultElem.style.display = "block";
        }
    </script>
</body>
</html>
