<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipnex AI — Trading Terminal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0d14;
            --panel-bg: #121824;
            --border-color: #1e2638;
            --accent-blue: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
            --green: #00e676;
            --red: #ff5252;
            --text-primary: #ffffff;
            --text-secondary: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Navbar Header */
        .navbar {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand i {
            color: var(--accent-blue);
        }

        .brand-badge {
            background: var(--accent-gradient);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .status-tag {
            font-size: 11px;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Layout Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 992px) {
            .main-grid {
                grid-template-columns: 2fr 1fr;
            }
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-header i {
            color: var(--accent-blue);
            margin-left: 6px;
        }

        select, input, button {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 10px;
            font-size: 13px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
        }

        .btn-action {
            background: var(--accent-gradient);
            border: none;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.2s;
        }

        .btn-action:active {
            opacity: 0.8;
        }

        /* Container Frames */
        .chart-box {
            height: 420px;
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
        }

        .analysis-box {
            height: 420px;
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
        }

        /* Risk Calculator Grid */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
        }

        .field-group label {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .result-display {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-blue);
            padding: 8px;
            background: rgba(0, 242, 254, 0.05);
            border-radius: 6px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="navbar">
        <div class="brand">
            <i class="fa-solid fa-chart-line"></i>
            Pipnex AI
            <span class="brand-badge">TERMINAL</span>
        </div>
        <div class="status-tag">
            <i class="fa-solid fa-circle" style="font-size: 8px;"></i> متصل بالمؤشرات الحية
        </div>
    </div>

    <!-- Main Section -->
    <div class="main-grid">
        <!-- Chart Column -->
        <div class="card">
            <div class="card-header">
                <span><i class="fa-solid fa-chart-candlestick"></i> الرسم البياني المباشر</span>
                <select id="pairSelect" style="width: auto; padding: 4px 8px;" onchange="changePair()">
                    <option value="OANDA:XAUUSD">XAU/USD (الذهب)</option>
                    <option value="FX:EURUSD">EUR/USD</option>
                    <option value="FX:GBPUSD">GBP/USD</option>
                    <option value="BINANCE:BTCUSDT">BTC/USDT</option>
                </select>
            </div>
            <div class="chart-box" id="tv_chart"></div>
        </div>

        <!-- Technical Analysis Widget Column -->
        <div class="card">
            <div class="card-header">
                <span><i class="fa-solid fa-microchip"></i> ملخص التحليل الفني اللحظي</span>
            </div>
            <div class="analysis-box" id="tv_ta"></div>
        </div>
    </div>

    <!-- Risk Calculator Bottom Card -->
    <div class="card">
        <div class="card-header">
            <span><i class="fa-solid fa-calculator"></i> حاسبة إدارة المخاطر واللوت</span>
        </div>
        <div class="calc-grid">
            <div class="field-group">
                <label>رأس المال ($)</label>
                <input type="number" id="calcBalance" value="1000">
            </div>
            <div class="field-group">
                <label>المخاطرة (%)</label>
                <input type="number" id="calcRisk" value="1">
            </div>
            <div class="field-group">
                <label>الاستوب (Pips)</label>
                <input type="number" id="calcSL" value="30">
            </div>
            <div class="field-group" style="display: flex; align-items: flex-end;">
                <button class="btn-action" onclick="calculateLot()">احسب العقد</button>
            </div>
        </div>
        <div id="calcResult" class="result-display" style="display: none;"></div>
    </div>

    <!-- TradingView Scripts -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        function loadChart(symbol) {
            document.getElementById("tv_chart").innerHTML = "";
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "60",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ar",
                "container_id": "tv_chart"
            });
        }

        function loadTA(symbol) {
            const container = document.getElementById("tv_ta");
            container.innerHTML = "";
            const script = document.createElement("script");
            script.type = "text/javascript";
            script.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            script.async = true;
            script.innerHTML = JSON.stringify({
                "interval": "1h",
                "width": "100%",
                "isTransparent": false,
                "height": "100%",
                "symbol": symbol,
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "ar",
                "colorTheme": "dark"
            });
            container.appendChild(script);
        }

        function changePair() {
            const sym = document.getElementById("pairSelect").value;
            loadChart(sym);
            loadTA(sym);
        }

        // Initialize on Load
        loadChart("OANDA:XAUUSD");
        loadTA("OANDA:XAUUSD");

        function calculateLot() {
            const balance = parseFloat(document.getElementById("calcBalance").value);
            const riskPercent = parseFloat(document.getElementById("calcRisk").value);
            const stopLossPips = parseFloat(document.getElementById("calcSL").value);
            if (!balance || !riskPercent || !stopLossPips) return;
            const riskAmount = balance * (riskPercent / 100);
            const lotSize = (riskAmount / (stopLossPips * 10)).toFixed(2);
            
            const resultElem = document.getElementById("calcResult");
            resultElem.innerText = `حجم العقد المناسب: ${lotSize} Lot | المخاطرة المالية: $${riskAmount.toFixed(2)}`;
            resultElem.style.display = "block";
        }
    </script>
</body>
</html>
